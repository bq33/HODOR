id: INTEL-MISPRINT-002
title: "Seller Reputation Farming"
summary: >
  Networks of fake accounts conduct circular transactions to
  artificially inflate seller ratings and review counts. The
  manufactured reputation is then used to establish trust with
  legitimate buyers, who are more likely to purchase high-value
  items from sellers with strong ratings. Once sufficient trust
  is established, the accounts either sell counterfeit or
  misrepresented items, run advance-fee scams, or are sold to
  third parties as "aged, reputable seller accounts" on dark
  web marketplaces.

dates:
  first_observed: "2024-06-10"
  last_observed: "2025-04-02"
  intel_created: "2024-07-18"
  last_updated: "2025-04-02"

status: active

intelligence_type: threat_pattern

severity: high

threat_categories:
  - reputation_manipulation
  - coordinated_inauthentic_behavior
  - trust_exploitation
  - fraud_enablement

affected_surfaces:
  - seller_ratings: "Star ratings and review counts inflated through fake transactions"
  - buyer_trust_signals: "Badges, 'Top Seller' status, and trust indicators gamed through volume of fabricated transactions"
  - review_system: "Positive reviews generated by coordinated accounts provide false social proof"
  - transaction_history: "Seller's completed transaction count inflated to suggest experience and reliability"
  - search_ranking: "Sellers with higher ratings and transaction volumes rank higher in search results, amplifying the fraud"

tactics_techniques:
  - name: "Transaction loop farming"
    description: >
      A network of 5-20 accounts controlled by the same operator
      buy and sell low-value items ($1-5) to each other in rapid
      succession. Each transaction generates a positive rating for
      both the buyer and seller account. Within 2-4 weeks, accounts
      accumulate 50-200+ positive ratings with no legitimate commerce.
  - name: "Review seeding"
    description: >
      After completing circular transactions, the coordinated accounts
      leave detailed, plausible-sounding positive reviews. The reviews
      reference specific aspects of the transaction ("fast shipping,"
      "item exactly as described," "great packaging") to appear organic.
  - name: "Badge farming"
    description: >
      The operator targets specific platform badge thresholds (e.g.,
      "100 sales," "99% positive rating," "Verified Seller") by
      engineering exactly the transaction volume and rating distribution
      needed to qualify.
  - name: "Account sale"
    description: >
      Once accounts reach a target reputation level, they are sold on
      dark web forums and Telegram channels as "established seller
      accounts." Buyers of these accounts use them to run high-value
      scams with the cover of a trusted reputation.

indicators:
  - "Seller accounts with 50+ transactions but average transaction value below $5 and no transactions above $20"
  - "Clusters of accounts that exclusively transact with each other and have no transactions with accounts outside the cluster"
  - "Accounts that achieve 100% positive rating across 50+ transactions with zero neutral or negative reviews"
  - "Reviews that follow a template pattern: similar length, similar phrasing, posted within minutes of transaction completion"
  - "Seller accounts with high transaction volume but zero buyer-initiated messages or questions"
  - "Accounts created in batches (similar registration dates, similar username patterns, sequential email addresses)"
  - "Sudden shift in listing behavior: account sells low-value items for weeks, then abruptly lists a high-value item at 3-5x the account's previous average"

recommended_actions:
  - action: "Deploy seller reputation scoring with velocity and network analysis"
    priority: critical
    description: >
      Weight seller reputation based on transaction diversity, buyer
      uniqueness, value distribution, and network independence rather
      than raw transaction count and rating percentage.
    control_ref: "controls/seller-reputation-scoring.yaml"
  - action: "Implement review authenticity analysis"
    priority: high
    description: >
      Analyze review text for template patterns, timing anomalies
      (reviews posted within seconds of delivery confirmation), and
      reviewer account quality.
  - action: "Add friction to badge qualification"
    priority: medium
    description: >
      Require minimum transaction value thresholds, minimum buyer
      diversity, and minimum account age before seller badges are
      awarded. Display the distribution of transaction values alongside
      the badge so buyers can assess whether the reputation is built
      on genuine high-value commerce.
  - action: "Monitor for account sales"
    priority: medium
    description: >
      Detect behavioral discontinuities that suggest an account has
      changed hands: sudden change in login location, device, listing
      category, pricing behavior, or communication style.

owner: "Trust & Safety Lead"

related_controls:
  - "controls/seller-reputation-scoring.yaml"
  - "controls/listing-integrity-scoring.yaml"

related_runbooks:
  - "runbooks/marketplace-integrity-response.yaml"

related_metrics:
  - metric: "reputation_farming_detection_rate"
    description: "Percentage of confirmed reputation farming networks detected before high-value scam execution"
    target: ">60%"
  - metric: "fake_review_identification_rate"
    description: "Percentage of reviews identified as inauthentic through automated analysis"
    target: ">50%"
  - metric: "badge_integrity_rate"
    description: "Percentage of badged sellers whose reputation is built on diverse, genuine transactions"
    target: ">95%"
  - metric: "account_sale_detection_rate"
    description: "Percentage of sold/transferred accounts detected through behavioral discontinuity analysis"
    target: ">40%"

notes: >
  Reputation farming is a precursor crime. By itself, having a fake
  reputation doesn't directly harm buyers. The harm comes from what
  the fake reputation enables: high-value scams, counterfeit sales,
  and advance-fee fraud. This means the detection window is actually
  favorable. If the platform can identify farming during the low-value
  circular transaction phase, it can disrupt the operation before any
  buyer is harmed. The challenge is distinguishing farming from
  legitimate low-value trading activity, which is common on
  collectibles platforms where many items genuinely trade for $1-5.

  The account sale market is a growing concern. Established seller
  accounts with 200+ positive ratings sell for $500-2,000 on dark
  web forums, which creates a persistent economic incentive for
  farming operations even when individual farming networks are
  disrupted.
