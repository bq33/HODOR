      - metrics-and-reporting/kpis/trust-safety-kpis.md#challenge-solve-rate

  content-abuse:
    description: >
      Submission of prohibited, harmful, or manipulative content including
      counterfeit listings, misleading product descriptions, hate speech,
      harassment, and scam communications.
    severity: high
    threat_actors:
